{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">📝 Создание нового голосования</h3>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Тема / Заголовок голосования:</label>
                        <input type="text" name="title" class="form-control" placeholder="Например: Установка шлагбаума во дворе" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Описание:</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Подробности для жильцов..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Выберите дом:</label>
                        <select name="building_id" class="form-select" required>
                            <option value="" disabled selected>-- Выберите дом --</option>
                            {% for b in buildings %}
                                <option value="{{ b['id'] }}">{{ b['address'] }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Дата и время окончания:</label>
                            <input type="datetime-local" name="expires_at" class="form-control" required>
                        </div>
                        <div class="col-md-6 d-flex align-items-center">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" name="is_anonymous" id="isAnonymousSwitch" value="true">
                                <label class="form-check-label" for="isAnonymousSwitch">Анонимное голосование</label>
                            </div>
                        </div>
                    </div>

                    <hr>
                    <h5 class="mb-3">Варианты ответа:</h5>
                    <div id="optionsContainer">
                        <div class="input-group mb-2">
                            <input type="text" name="options" class="form-control" placeholder="Вариант ответа №1" required>
                            <button class="btn btn-outline-danger" type="button" onclick="removeOption(this)" disabled>Удалить</button>
                        </div>
                        <div class="input-group mb-2">
                            <input type="text" name="options" class="form-control" placeholder="Вариант ответа №2" required>
                            <button class="btn btn-outline-danger" type="button" onclick="removeOption(this)" disabled>Удалить</button>
                        </div>
                    </div>
                    
                    <button type="button" class="btn btn-outline-secondary btn-sm mb-4" onclick="addOption()">➕ Добавить вариант ответа</button>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Назад</a>
                        <button type="submit" class="btn btn-success">Создать голосование</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function addOption() {
    const container = document.getElementById('optionsContainer');
    const count = container.children.length + 1;
    
    const div = document.createElement('div');
    div.className = 'input-group mb-2';
    div.innerHTML = `
        <input type="text" name="options" class="form-control" placeholder="Вариант ответа №${count}" required>
        <button class="btn btn-outline-danger" type="button" onclick="removeOption(this)">Удалить</button>
    `;
    container.appendChild(div);
    updateRemoveButtons();
}

function removeOption(button) {
    button.parentElement.remove();
    updateRemoveButtons();
}

function updateRemoveButtons() {
    const container = document.getElementById('optionsContainer');
    const buttons = container.querySelectorAll('button');
    buttons.forEach(btn => {
        btn.disabled = buttons.length <= 2;
    });
}
</script>
{% endblock %}
