{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Вход в систему</h3>
                
                {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Логин:</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль:</label>
                        <div class="input-group">
                            <input type="password" name="password" id="passwordLogin" class="form-control" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordLogin">
                                👁️
                            </button>
                        </div>
                    </div>

                    <!-- Скрипт для переключения видимости пароля (Логин) -->
                    <script>
                    document.getElementById('togglePasswordLogin').addEventListener('click', function () {
                        const passwordInput = document.getElementById('passwordLogin');
                        if (passwordInput.type === 'password') {
                            passwordInput.type = 'text';
                            this.textContent = '🙈';
                        } else {
                            passwordInput.type = 'password';
                            this.textContent = '👁️';
                        }
                    });
                    </script>
                    <button type="submit" class="btn btn-primary w-100">Войти в систему</button>
                </form>
                    <div class="text-center mt-3">
                        <a href="/register" class="text-decoration-none">Нет аккаунта? Зарегистрироваться</a>
                    </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
